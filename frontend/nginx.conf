# Link-preview crawlers (WhatsApp, Signal, Telegram, Facebook, X, Slack, …) do
# not run JavaScript, so the SPA shell would give them no quest-specific tags.
# They get routed to the backend's /api/share endpoint, which renders real Open
# Graph meta for the quest; every other user agent gets the app as usual.
map $http_user_agent $is_crawler {
    default                    0;
    "~*facebookexternalhit"    1;
    "~*facebookcatalog"        1;
    "~*WhatsApp"               1;
    "~*Twitterbot"             1;
    "~*Slackbot"               1;
    "~*TelegramBot"            1;
    "~*Discordbot"             1;
    "~*SkypeUriPreview"        1;
    "~*LinkedInBot"            1;
    "~*Pinterest"              1;
    "~*redditbot"              1;
    "~*Signal"                 1;
    "~*Applebot"               1;
    "~*vkShare"                1;
    "~*Embedly"                1;
    "~*(bot|crawler|spider|preview|scraper)" 1;
}

# Websocket upgrade only when the client actually asked for one — socket.io
# falls back to plain HTTP polling on networks that block the upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Generated images (achievements, pet portraits, quest scenes) are written
    # to the backend's disk and referenced by absolute APP_URL. Without this
    # they fall through to the SPA catch-all and return index.html.
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    # Shared quest links: crawlers get server-rendered Open Graph tags,
    # humans get the SPA.
    location ~ "^/quest/(?<quest_slug>[^/]+)/?$" {
        if ($is_crawler) {
            proxy_pass http://backend:3000/api/share/quest/$quest_slug;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
