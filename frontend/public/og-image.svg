<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b" />
      <stop offset="0.55" stop-color="#312e81" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55" />
      <stop offset="1" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="915" cy="315" r="300" fill="url(#glow)" />

  <!-- compass -->
  <g transform="translate(915 315)">
    <circle r="170" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" />
    <circle r="140" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2" />
    <g stroke="#ffffff" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-170" x2="0" y2="-148" />
      <line x1="170" y1="0" x2="148" y2="0" />
      <line x1="0" y1="170" x2="0" y2="148" />
      <line x1="-170" y1="0" x2="-148" y2="0" />
    </g>
    <path d="M0 -132 L52 0 L0 132 L-52 0 Z" fill="#ffffff" fill-opacity="0.14" />
    <path d="M0 -132 L52 0 L0 0 Z" fill="#ffffff" />
    <path d="M0 132 L-52 0 L0 0 Z" fill="#fbbf24" />
    <circle r="17" fill="#0f172a" stroke="#ffffff" stroke-width="5" />
  </g>

  <!-- wordmark -->
  <g transform="translate(96 250)">
    <text x="0" y="0" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
          font-size="86" font-weight="800" fill="#ffffff" letter-spacing="-2">SideQuest</text>
    <text x="0" y="70" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
          font-size="34" font-weight="500" fill="#c7d2fe">Quests in der echten Welt.</text>
    <text x="0" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
          font-size="27" font-weight="400" fill="#a5b4fc" fill-opacity="0.85">Entdecken · Annehmen · Abschliessen</text>
  </g>
</svg>
