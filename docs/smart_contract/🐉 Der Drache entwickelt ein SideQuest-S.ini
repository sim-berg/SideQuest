⚠️ Wichtige Sicherheitsaspekte

Ein Smart Contract ist nach der Veröffentlichung oft unveränderlich. Fehler können teuer werden.

Achte besonders auf:

🔒 Keine Vertrauensannahmen gegenüber dem Client – alle kritischen Daten müssen verifiziert werden.
💰 Belohnungen nur einmal auszahlen – verhindere doppelte Einlösungen.
🔁 Replay-Schutz – dieselbe Anfrage darf nicht mehrfach verwendet werden.
🆔 Eindeutige Quest-IDs – jede Quest muss eindeutig identifizierbar sein.
⏳ Ablaufzeiten – Quests sollten nach einem Enddatum nicht mehr angenommen werden können.
👥 Berechtigungen – nur autorisierte Accounts dürfen Quests erstellen, ändern oder löschen.
💸 Compute Budget – Solana-Programme haben begrenzte Compute Units; aufwendige Berechnungen gehören oft Off-Chain.
📦 Account-Größen – Accounts haben feste Größen. Wachsende Listen (z. B. Millionen abgeschlossener Quests) benötigen durchdachte Datenstrukturen oder mehrere Accounts.
🔄 Upgrade-Strategie – während der Entwicklung kann ein Programm upgradefähig sein; später entscheiden viele Projekte bewusst, die Upgrade-Berechtigung zu entfernen, um Vertrauen zu schaffen.
