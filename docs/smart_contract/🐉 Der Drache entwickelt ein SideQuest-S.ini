          📱 Karte & Benutzeroberfläche

Die wichtigste Designentscheidung ist die klare Trennung der Verantwortlichkeiten: Die Blockchain erzwingt die Spielregeln und verwaltet Werte, während Off-Chain-Komponenten (Oracle, Backend, App) die reale Welt beobachten und kryptographisch nachweisbare Informationen an die Smart Contracts liefern. Dieses Zusammenspiel ermöglicht ein faires Geo-Spiel mit XP, Token-Belohnungen und digitalen Besitzrechten.