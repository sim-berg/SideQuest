Merksätze für deinen Drachen 🐉
🌍 Solana = die Blockchain.

🪙 SOL = die Währung.

👛 Wallet = verwaltet deine Schlüssel.

🔑 Private Key = geheim, damit unterschreibst du.

📬 Public Key = deine öffentliche Adresse.

📄 Account = speichert SOL, Tokens oder beliebige Daten.

📦 Programm = der Smart Contract auf Solana.

🦀 Rust = Sprache für Solana-Programme.

🧱 Anchor = Framework, das Solana-Entwicklung stark vereinfacht.

📨 Instruction = ein einzelner Funktionsaufruf.

📦➡️📦 Transaction = eine oder mehrere Instructions, die gemeinsam ausgeführt werden.

🏦 PDA = ein programmgesteuerter Account ohne privaten Schlüssel.

⚡ Compute Units = Rechenbudget pro Transaktion.

Man kann sich Solana wie ein Betriebssystem vorstellen: Accounts sind die Dateien, Programme sind die Anwendungen, und Transaktionen sind die Aktionen, die Anwendungen auf diesen Dateien ausführen. Dieses Modell macht Solana leistungsfähig und erlaubt viele Programme, parallel zu arbeiten.