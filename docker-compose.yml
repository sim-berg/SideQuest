# Deployed as a single Coolify "Docker Compose" resource: point the domain at
# the `frontend` service (it proxies /api, /uploads and /socket.io to the
# backend over the compose network) and set the variables below in Coolify's
# Environment Variables tab. Values must stay as ${...} placeholders — a
# literal here would silently win over anything configured in Coolify.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Loopback-only so `npm run dev` (backend outside docker) reaches it,
    # without exposing mongo to the internet on the Coolify host.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/sidequest
      # Required. Reusing the previous value keeps existing logins alive.
      JWT_SECRET: "${JWT_SECRET}"
      # Required: public origin of the app, scheme included and no trailing
      # slash (https://sidequest.example.com). Every absolute URL — badge and
      # pet images, comment photo uploads — is built from this.
      APP_URL: "${APP_URL}"
      CORS_ORIGIN: "${APP_URL}"
      # Optional — without a token, achievement badges fall back to generated
      # SVGs and quest scenes / pet portraits are skipped.
      REPLICATE_API_TOKEN: "${REPLICATE_API_TOKEN:-}"
      # Optional overrides; empty falls back to the models pinned in
      # replicate.service.ts.
      REPLICATE_MODEL: "${REPLICATE_MODEL:-}"
      REPLICATE_SCENE_MODEL: "${REPLICATE_SCENE_MODEL:-}"
      REPLICATE_PET_MODEL: "${REPLICATE_PET_MODEL:-}"
      # Optional — without a key, pet souls, chat and personalized dailies
      # fall back to templates.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Optional; empty falls back to the default in anthropic.service.ts.
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
    volumes:
      # Generated images (badges, scenes, pet portraits, comment uploads);
      # without this they are lost on every redeploy.
      - backend-uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Reached through Coolify's proxy on the compose network, so no host port
    # is published. For a local `docker compose up`, add: ports: ["5173:80"]
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-uploads:
