services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/sidequest
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: "*"
      # Public origin of the app — used for share links, og:image and upload URLs.
      APP_URL: "http://localhost:5173"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
