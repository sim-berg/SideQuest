services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/devsidequest
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: "*"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mongo-data:
